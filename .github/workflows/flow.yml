name: test-mpd-extraction

on:
    push:
        branches:
            - main
            - dev
    schedule:
        - cron: "0 0 * * 0"
    workflow_dispatch:

jobs:
    run_script:
        name: Run Python Script and test the .mpd extraction
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-python@v6
              with:
                  python-version: "3.12"
            - run: pip install -r requirements.txt
            - name: Test MPD extraction
              shell: bash
              run: |
                  urls=(
                      "https://www.ceskatelevize.cz/porady/898602-chobotnice-z-ii-patra/287350951300001"
                      "https://www.ceskatelevize.cz/porady/11599761360-v-pasti/217381481400001/"
                      "https://www.ceskatelevize.cz/porady/1119695675-zrcadlo-doby/203562276570001/"
                  )

                  for url in "${urls[@]}"; do
                      set +e
                      python extract.py --url "$url"
                      status=$?
                      set -e

                      if [ "$status" -eq 2 ]; then
                          echo "Regional availability restriction detected for $url; not a script failure."
                      elif [ "$status" -ne 0 ]; then
                          exit "$status"
                      fi
                  done
