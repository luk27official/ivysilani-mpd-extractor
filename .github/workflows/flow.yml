name: test-mpd-extraction

on:
    push:
        branches:
            - main
            - dev
    schedule:
        - cron: "0 0 * * 0"
    workflow_dispatch:

jobs:
    run_script:
        name: Run Python Script and test the .mpd extraction
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-python@v6
              with:
                  python-version: "3.12"
            - run: pip install -r requirements.txt
            - run: python extract.py --url https://www.ceskatelevize.cz/porady/15003337252-bubak/
            - run: python extract.py --url https://www.ceskatelevize.cz/porady/16866898966-pan-nikdo-proti-putinovi/
